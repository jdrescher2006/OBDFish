name: Mirror Poetaster OBDFish releases

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/mirror-poetaster-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror verified original RPMs and Git tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in 0.94-4 0.94-5 0.95; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; leaving it untouched."
              continue
            fi

            # Keep the original upstream tag points and authorship.
            git fetch --no-tags https://github.com/poetaster/OBDFish.git \
              "refs/tags/$tag:refs/tags/$tag"
            git push origin "refs/tags/$tag"

            mkdir -p "upstream-rpms/$tag"
            while read -r release filename expected; do
              if [ "$release" != "$tag" ]; then continue; fi
              file="upstream-rpms/$tag/$filename"
              curl --fail --location --retry 3 \
                "https://github.com/poetaster/OBDFish/releases/download/$tag/$filename" \
                -o "$file"
              printf '%s  %s\n' "$expected" "$file" | sha256sum --check
            done < .github/poetaster-releases.sha256

            gh release create "$tag" "upstream-rpms/$tag/"*.rpm \
              --verify-tag \
              --title "$tag (mirrored from poetaster)" \
              --notes "Mirror of https://github.com/poetaster/OBDFish/releases/tag/$tag. These are the original RPM assets from poetaster/OBDFish, downloaded and SHA-256 verified without rebuilding or modification. Original authorship remains with the upstream contributors. Files retain their original RPM filenames (which may not match the Git tag)."
          done
